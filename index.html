<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES — Celestial Cloud Storage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-deep: #030712;
      --bg-navy: #07112b;
      --bg-card: rgba(11, 22, 52, 0.72);
      --bg-card-hover: rgba(16, 32, 74, 0.85);
      --border-soft: rgba(148, 184, 255, 0.16);
      --border-glow: rgba(96, 165, 250, 0.45);
      --text-main: #f0f6ff;
      --text-muted: #94a8d0;
      --accent: #60a5fa;
      --accent-bright: #93c5fd;
      --accent-indigo: #818cf8;
      --danger: #f87171;
      --success: #34d399;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background: radial-gradient(ellipse at top, #0c1d4a 0%, var(--bg-navy) 45%, var(--bg-deep) 100%);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Celestial Twinkling Background */
    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .nebula-1 {
      width: 420px;
      height: 420px;
      top: -120px;
      left: -80px;
      background: #1d4ed8;
    }

    .nebula-2 {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -80px;
      background: #4338ca;
    }

    .hidden {
      display: none !important;
    }

    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-soft);
      box-shadow: 0 20px 50px rgba(0, 4, 18, 0.55);
    }

    /* ================= AUTH VIEW ================= */
    .auth-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      border-radius: var(--radius-lg);
      padding: 36px 30px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-emblem {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.22), rgba(129, 140, 248, 0.22));
      border: 1px solid var(--border-glow);
      color: var(--accent-bright);
      box-shadow: 0 0 24px rgba(96, 165, 250, 0.25);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.14em;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #93c5fd, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: var(--radius-md);
      background: rgba(3, 7, 18, 0.55);
      border: 1px solid var(--border-soft);
      margin-bottom: 20px;
    }

    .auth-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
    }

    .status-banner {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }

    .status-banner.error {
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.4);
      color: #fecaca;
    }

    .status-banner.success {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.4);
      color: #a7f3d0;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-group label {
      display: block;
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: rgba(3, 7, 18, 0.65);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 44px;
    }

    .icon-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover {
      color: var(--text-main);
    }

    .primary-btn {
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.96rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.48);
    }

    .primary-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-footnote {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 18px;
    }

    /* ================= DASHBOARD VIEW ================= */
    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.25), rgba(129, 140, 248, 0.25));
      border: 1px solid var(--border-glow);
      color: var(--accent-bright);
    }

    .topbar-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-pill {
      font-size: 0.85rem;
      color: var(--accent-bright);
      background: rgba(96, 165, 250, 0.12);
      border: 1px solid var(--border-soft);
      padding: 7px 13px;
      border-radius: 999px;
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: var(--border-glow);
    }

    /* Overview Grid: Storage Ring + Upload Zone */
    .overview-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      margin-bottom: 26px;
    }

    @media (max-width: 860px) {
      .overview-grid {
        grid-template-columns: 1fr;
      }
    }

    .storage-card {
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ring-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 6px 0 16px;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(148, 184, 255, 0.12);
      stroke-width: 12;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 427.26;
      stroke-dashoffset: 427.26;
      transition: stroke-dashoffset 0.6s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ring-percent {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
    }

    .ring-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .storage-numbers {
      font-size: 0.96rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .storage-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .mini-stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-soft);
    }

    .mini-stat {
      background: rgba(3, 7, 18, 0.42);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
    }

    .mini-stat strong {
      display: block;
      font-size: 1.05rem;
      color: var(--accent-bright);
    }

    .mini-stat span {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* Upload Card */
    .upload-card {
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dropzone {
      flex: 1;
      border: 1.5px dashed rgba(96, 165, 250, 0.42);
      border-radius: var(--radius-md);
      background: rgba(3, 7, 18, 0.42);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .dropzone.dragover {
      border-color: var(--accent-bright);
      background: rgba(37, 99, 235, 0.14);
    }

    .dropzone-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(96, 165, 250, 0.14);
      color: var(--accent-bright);
      margin-bottom: 12px;
    }

    .dropzone h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .dropzone p {
      font-size: 0.86rem;
      color: var(--text-muted);
      max-width: 380px;
    }

    .upload-progress-wrap {
      margin-top: 16px;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(148, 184, 255, 0.14);
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      transition: width 0.25s ease;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .filter-pill .count-badge {
      background: rgba(148, 184, 255, 0.14);
      color: var(--text-main);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
    }

    .filter-pill.active {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border-color: transparent;
      color: #ffffff;
    }

    .filter-pill.active .count-badge {
      background: rgba(255, 255, 255, 0.22);
    }

    .search-box {
      position: relative;
      min-width: 240px;
      flex: 1;
      max-width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Separate Media Sections */
    .vault-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-count {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.14);
      color: var(--accent-bright);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .item-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
    }

    .item-thumb {
      height: 142px;
      background: rgba(3, 7, 18, 0.65);
      display: grid;
      place-items: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .item-thumb img,
    .item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-type-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(3, 7, 18, 0.78);
      border: 1px solid var(--border-soft);
      color: var(--accent-bright);
      text-transform: uppercase;
    }

    .item-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .mini-btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
    }

    .mini-btn:hover {
      border-color: var(--accent);
    }

    .mini-btn.delete:hover {
      border-color: var(--danger);
      color: #fecaca;
    }

    .empty-state {
      padding: 26px;
      text-align: center;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Preview Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 18, 0.84);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 780px;
      border-radius: var(--radius-lg);
      padding: 20px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-media {
      max-height: 68vh;
      display: grid;
      place-items: center;
      overflow: auto;
      border-radius: var(--radius-md);
      background: rgba(3, 7, 18, 0.7);
      padding: 10px;
    }

    .modal-media img,
    .modal-media video {
      max-width: 100%;
      max-height: 64vh;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula nebula-1" aria-hidden="true"></div>
  <div class="nebula nebula-2" aria-hidden="true"></div>

  <!-- ================= AUTH VIEW ================= -->
  <section id="auth-view" class="auth-wrapper">
    <div class="auth-card glass">
      <div class="brand-header">
        <div class="brand-emblem" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
          </svg>
        </div>
        <h1 class="brand-title">ARCHIVES</h1>
        <p class="brand-subtitle">Private celestial vault · 1 GB personal space</p>
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-mode="login">Sign In</button>
        <button type="button" class="auth-tab" data-mode="signup">Create Account</button>
      </div>

      <div id="auth-message" class="status-banner hidden" role="alert"></div>

      <form id="auth-form" novalidate>
        <div class="field-group hidden" id="name-group">
          <label for="full-name">Display Name</label>
          <input type="text" id="full-name" placeholder="e.g. Alex" autocomplete="name" />
        </div>

        <div class="field-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required />
            <button type="button" id="toggle-password" class="icon-btn" aria-label
